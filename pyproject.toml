[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vit-pytorch"
version = "0.1.0"
description = "Educational Vision Transformer implementations with PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
	{ name = "ViT-PyTorch contributors" }
]
dependencies = [
	"numpy>=1.24",
	"torch>=2.0",
	"torchvision>=0.15",
]

[project.optional-dependencies]
dev = [
	"pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vit_pytorch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
